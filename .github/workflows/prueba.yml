name: Prueba de tokens

on:
  push:

jobs:
  comparar-tokens:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Comprobar DEV_TOKEN
        shell: powershell
        env:
          DEV_TOKEN: ${{ secrets.DEV_TOKEN }}
        run: |
          if ($env:DEV_TOKEN -eq $env:LOCAL_DEV_TOKEN) {
            Write-Host "Los tokens coinciden"
          }
          else {
            Write-Host "Los tokens NO coinciden"
            exit 1
          }